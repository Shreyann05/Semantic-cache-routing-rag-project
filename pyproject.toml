[project]
name = "semantic-cache-rag"
version = "0.1.0"
description = "Measurable semantic caching and cost-aware routing for RAG"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "streamlit>=1.38", "httpx>=0.27", "python-dotenv>=1.0", "sentence-transformers>=3.0", "qdrant-client>=1.11", "litellm>=1.50"]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
